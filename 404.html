  <!-- ========================================== -->
  <!-- JAVASCRIPT CONTROLLER                      -->
  <!-- ========================================== -->
    <script>
    let currentTheme = localStorage.getItem('theme') || 'light';
    let currentDir = localStorage.getItem('dir') || 'ltr';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initDir();
    });

    function initTheme() {
      if (currentTheme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        currentTheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        currentTheme = 'light';
      }
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        currentTheme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        currentTheme = 'dark';
      }
    }

    function initDir() {
      document.documentElement.setAttribute('dir', currentDir);
      const label = document.getElementById('rtl-status-label');
      if (label) label.innerText = currentDir.toUpperCase();
    }

    function toggleRTL() {
      currentDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('dir', currentDir);
      localStorage.setItem('dir', currentDir);
      const label = document.getElementById('rtl-status-label');
      if (label) label.innerText = currentDir.toUpperCase();
    }

    function togglePasswordVisibility(inputId = 'password-input') {
      const pwdInput = document.getElementById(inputId);
      if (!pwdInput) return;
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
      } else {
        pwdInput.type = 'password';
      }
    }
  </script>
