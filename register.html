<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-screen overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOMNA SLEEP | Create VIP Account</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%230F172A'/%3E%3Cpath d='M75 50.5A29.7 29.7 0 0 1 45.3 80.2 29.7 29.7 0 0 1 15.6 50.5 29.7 29.7 0 0 1 38.8 21.8a27.6 27.6 0 0 0 6.5 17.7A27.7 27.7 0 0 0 63 46a27.6 27.6 0 0 0 12-4.5z' fill='%23FACC15'/%3E%3C/svg%3E">
  
  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sleep: {
              50: '#f4f6fa',
              100: '#e6ebf4',
              200: '#d1dceb',
              300: '#b0c3de',
              400: '#89a4cd',
              500: '#6886bd',
              600: '#526ca9',
              700: '#43568b',
              800: '#3a4972',
              900: '#0F172A',
              950: '#0a0f1d',
            },
            amber: {
              300: '#fde047',
              400: '#facc15',
              500: '#eab308',
            },
            sand: {
              50: '#fbfaf8',
              100: '#f5f2eb',
              200: '#e9e3d5',
              300: '#d9cfbb',
              400: '#c5b59b',
            }
          },
          boxShadow: {
            'sleep-soft': '0 10px 30px -10px rgba(15, 23, 42, 0.08)',
            'sleep-hover': '0 25px 50px -12px rgba(15, 23, 42, 0.18)',
            'glow-amber': '0 0 25px rgba(250, 204, 21, 0.25)',
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Plus Jakarta Sans for luxury feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    @layer base {
      *, ::before, ::after {
        box-sizing: border-box;
      }
      html, body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden !important;
        max-width: 100vw;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        width: 100%;
        max-width: 100vw;
        @apply bg-sand-50 text-slate-800 dark:bg-sleep-950 dark:text-slate-100 antialiased transition-colors duration-300;
      }
      img, video, iframe, canvas, svg {
        max-width: 100%;
        height: auto;
      }
      h1, h2, h3, h4, h5, h6, p, span, a, button {
        overflow-wrap: break-word;
        word-break: break-word;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center fixed inset-0 bg-sand-50 dark:bg-sleep-950">

  <!-- ========================================== -->
  <!-- TOP STICKY / FIXED CONTROLS BAR            -->
  <!-- ========================================== -->
  <div class="fixed top-4 sm:top-6 right-4 sm:right-6 z-50 flex items-center justify-end pointer-events-none">
    
    <!-- RIGHT SIDE ONLY: BACK TO STORE, DARK MODE & RTL TOGGLE BUTTONS -->
    <div class="pointer-events-auto flex items-center space-x-2 sm:space-x-3 rtl:space-x-reverse">
      
      <!-- RETURN TO STORE BUTTON -->
      <a href="index.html" 
         title="Return to Main Store"
         class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs font-bold bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-lg transition-all duration-200 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400 transform hover:-translate-y-0.5">
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Back to Store</span>
      </a>

      <!-- DARK MODE TOGGLE BUTTON -->
      <button id="theme-toggle-btn" 
              type="button" 
              onclick="toggleDarkMode()" 
              aria-label="Toggle Dark Mode"
              title="Toggle Light / Dark Mode"
              class="p-2.5 sm:p-3 rounded-full bg-white/90 dark:bg-sleep-900/90 border border-sand-300 dark:border-sleep-800 text-slate-700 dark:text-slate-200 hover:bg-white dark:hover:bg-sleep-800 focus:outline-none focus:ring-2 focus:ring-amber-400 shadow-lg transition-all duration-200 hover:scale-105 active:scale-95 backdrop-blur-md">
        <svg id="theme-toggle-dark-icon" class="w-4 h-4 sm:w-5 sm:h-5 block dark:hidden text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg id="theme-toggle-light-icon" class="w-4 h-4 sm:w-5 sm:h-5 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
        </svg>
      </button>

      <!-- LTR / RTL DIRECTION TOGGLE BUTTON -->
      <button id="rtl-toggle-btn" 
              type="button" 
              onclick="toggleRTL()" 
              aria-label="Toggle Text Direction LTR or RTL"
              title="Toggle LTR / RTL Direction"
              class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-full text-xs font-extrabold bg-white/90 dark:bg-sleep-900/90 text-slate-800 dark:text-slate-200 border border-sand-300 dark:border-sleep-800 hover:bg-white dark:hover:bg-sleep-800 shadow-lg transition-all duration-200 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400 backdrop-blur-md">
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-500 dark:text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/>
        </svg>
        <span id="rtl-status-label" class="tracking-wide">LTR</span>
      </button>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN FULL-SCREEN NON-SCROLLING REGISTER    -->
  <!-- ========================================== -->
  <main class="w-full h-full flex items-center justify-center p-4 sm:p-6 overflow-hidden">
    
    <div class="max-w-lg w-full bg-white dark:bg-sleep-900 rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-8 border border-sand-300 dark:border-sleep-800 shadow-2xl space-y-4 max-h-[94vh] flex flex-col justify-center">
      
      <!-- BRAND HEADER WITH CLICKABLE LOGO LINK TO INDEX.HTML -->
      <div class="text-center space-y-1.5">
        <a href="index.html" title="Return to Somna Sleep Homepage" class="inline-flex items-center gap-2 group cursor-pointer hover:scale-105 transition-transform duration-200">
          <div class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-sleep-950 dark:bg-sleep-800 text-amber-400 border border-slate-700 shadow-lg group-hover:border-amber-400 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </div>
          <span class="text-lg sm:text-xl font-extrabold tracking-tight text-sleep-950 dark:text-white group-hover:text-amber-400 transition-colors">SOMNA SLEEP</span>
        </a>
        <h2 class="text-xl sm:text-2xl font-extrabold text-sleep-950 dark:text-white">Create VIP Account</h2>
        <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">Join Somna Sleep to unlock 100-night trials and concierge perks.</p>
      </div>

      <!-- REGISTRATION FORM -->
      <form onsubmit="event.preventDefault(); alert('VIP Account Created Successfully! Redirecting to login.html...'); window.location.href='login.html';" class="space-y-3">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-0.5">Full Name</label>
          <input type="text" required placeholder="John Doe" class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-sand-50 dark:bg-sleep-800 border border-sand-300 dark:border-sleep-700 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 text-sleep-900 dark:text-white transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-0.5">Email Address</label>
          <input type="email" required placeholder="name@example.com" class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-sand-50 dark:bg-sleep-800 border border-sand-300 dark:border-sleep-700 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 text-sleep-900 dark:text-white transition-all">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-0.5">Create Password</label>
            <div class="relative">
              <input id="reg-password" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-sand-50 dark:bg-sleep-800 border border-sand-300 dark:border-sleep-700 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 text-sleep-900 dark:text-white transition-all pr-8">
              <button type="button" onclick="togglePasswordVisibility('reg-password')" class="absolute right-2.5 top-2 sm:top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-0.5">Confirm Password</label>
            <div class="relative">
              <input id="confirm-password" type="password" required placeholder="••••••••" class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl bg-sand-50 dark:bg-sleep-800 border border-sand-300 dark:border-sleep-700 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 text-sleep-900 dark:text-white transition-all pr-8">
              <button type="button" onclick="togglePasswordVisibility('confirm-password')" class="absolute right-2.5 top-2 sm:top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-start gap-2 pt-0.5">
          <input type="checkbox" required id="terms" class="mt-0.5 w-3.5 h-3.5 rounded text-amber-400 focus:ring-amber-400 accent-amber-400">
          <label for="terms" class="text-[11px] sm:text-xs text-slate-600 dark:text-slate-300 leading-snug">
            I agree to the <a href="#" class="text-amber-500 font-bold hover:underline">Terms of Service</a> & <a href="#" class="text-amber-500 font-bold hover:underline">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" class="w-full py-3 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs sm:text-sm transition-all shadow-lg transform hover:-translate-y-0.5 active:translate-y-0">
          Create Free VIP Account &rarr;
        </button>
      </form>

      <!-- SOCIAL LOGIN DIVIDER -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-sand-300 dark:border-sleep-800 w-full"></div>
        <span class="bg-white dark:bg-sleep-900 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest absolute">Or Sign Up With</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="alert('Google Registration Initiated...');" class="py-2 px-3 rounded-xl border border-sand-300 dark:border-sleep-800 bg-sand-50 dark:bg-sleep-800/60 hover:bg-sand-100 dark:hover:bg-sleep-800 font-bold text-xs text-sleep-900 dark:text-white flex items-center justify-center gap-2 transition-all">
          <span>🌐 Google</span>
        </button>

        <button onclick="alert('Apple ID Registration Initiated...');" class="py-2 px-3 rounded-xl border border-sand-300 dark:border-sleep-800 bg-sand-50 dark:bg-sleep-800/60 hover:bg-sand-100 dark:hover:bg-sleep-800 font-bold text-xs text-sleep-900 dark:text-white flex items-center justify-center gap-2 transition-all">
          <span>🍎 Apple ID</span>
        </button>
      </div>

      <p class="text-center text-xs text-slate-500 dark:text-slate-400 pt-0.5">
        Already have an account? <a href="login.html" class="text-amber-500 font-bold hover:underline">Sign In</a>
      </p>

    </div>

  </main>

  <!-- ========================================== -->
  <!-- JAVASCRIPT CONTROLLER                      -->
  <!-- ========================================== -->
    <script>
    let currentTheme = localStorage.getItem('theme') || 'light';
    let currentDir = localStorage.getItem('dir') || 'ltr';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initDir();
    });

    function initTheme() {
      if (currentTheme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        currentTheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        currentTheme = 'light';
      }
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        currentTheme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        currentTheme = 'dark';
      }
    }

    function initDir() {
      document.documentElement.setAttribute('dir', currentDir);
      const label = document.getElementById('rtl-status-label');
      if (label) label.innerText = currentDir.toUpperCase();
    }

    function toggleRTL() {
      currentDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('dir', currentDir);
      localStorage.setItem('dir', currentDir);
      const label = document.getElementById('rtl-status-label');
      if (label) label.innerText = currentDir.toUpperCase();
    }

    function togglePasswordVisibility(inputId = 'reg-password') {
      const pwdInput = document.getElementById(inputId);
      if (!pwdInput) return;
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
      } else {
        pwdInput.type = 'password';
      }
    }
  </script>
</body>
</html>
