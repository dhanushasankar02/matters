<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="masterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#masterBg)"/>

  <!-- Room Outline -->
  <rect x="100" y="80" width="600" height="440" rx="24" fill="none" stroke="#facc15" stroke-width="4"/>
  <text x="130" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#facc15">MASTER SUITE FLOORPLAN (14' x 16')</text>

  <!-- King Bed Centered -->
  <rect x="250" y="160" width="300" height="240" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="4"/>
  <text x="400" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">KING / CAL KING BED</text>
  <text x="400" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#a5b4fc" text-anchor="middle">Centered On Primary Wall</text>

  <!-- Nightstands -->
  <rect x="170" y="160" width="65" height="60" rx="8" fill="#334155"/>
  <text x="202" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#cbd5e1" text-anchor="middle">24" Table</text>

  <rect x="565" y="160" width="65" height="60" rx="8" fill="#334155"/>
  <text x="597" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#cbd5e1" text-anchor="middle">24" Table</text>

  <!-- Bench at Foot -->
  <rect x="280" y="420" width="240" height="50" rx="12" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#e2e8f0" text-anchor="middle">End-Of-Bed Bench</text>

  <rect x="250" y="500" width="300" height="40" rx="20" fill="#facc15"/>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#0f172a" text-anchor="middle">OPTIMAL 36" TRAFFIC CLEARANCE</text>
</svg>
