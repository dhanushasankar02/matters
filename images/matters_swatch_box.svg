<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="swatchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#swatchBg)"/>

  <!-- Swatch Box Frame -->
  <rect x="150" y="160" width="500" height="340" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <text x="400" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">SOMNA SLEEP FABRIC SWATCH KIT</text>
  <text x="400" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">Touch &amp; Feel Organic Materials At Home</text>

  <!-- Swatch Samples inside box -->
  <!-- Swatch 1: Organic Cotton -->
  <rect x="190" y="200" width="120" height="180" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="250" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">Organic Sateen</text>
  <text x="250" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748b" text-anchor="middle">100% Cotton</text>

  <!-- Swatch 2: Gel Memory Foam -->
  <rect x="340" y="200" width="120" height="180" rx="16" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <text x="400" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">Cooling Gel</text>
  <text x="400" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#0369a1" text-anchor="middle">Phase-Change Foam</text>

  <!-- Swatch 3: Dunlop Latex -->
  <rect x="490" y="200" width="120" height="180" rx="16" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
  <text x="550" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">Dunlop Latex</text>
  <text x="550" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#854d0e" text-anchor="middle">Eco Botanical</text>

  <rect x="250" y="420" width="300" height="48" rx="24" fill="url(#boxGrad)"/>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#0f172a" text-anchor="middle">100% FREE HOME DELIVERY</text>
</svg>
