<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#studioBg)"/>

  <!-- Room Outline -->
  <rect x="120" y="80" width="560" height="440" rx="24" fill="none" stroke="#facc15" stroke-width="4"/>
  <text x="150" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#facc15">URBAN APARTMENT STUDIO (9' x 10')</text>

  <!-- Corner Bed Position (Full or Twin XL) -->
  <rect x="150" y="150" width="220" height="240" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="4"/>
  <text x="260" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">FULL / TWIN XL BED</text>
  <text x="260" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#c084fc" text-anchor="middle">Corner Placement</text>
  <rect x="160" y="350" width="200" height="30" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="260" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#e9d5ff" text-anchor="middle">Under-Bed Storage Drawers</text>

  <!-- Multi-functional Living Lounge Area -->
  <rect x="420" y="150" width="220" height="120" rx="12" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="530" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#f1f5f9" text-anchor="middle">Convertible Sofa</text>

  <rect x="420" y="300" width="220" height="120" rx="12" fill="#334155"/>
  <text x="530" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#cbd5e1" text-anchor="middle">Media Console & Desk</text>

  <rect x="250" y="475" width="300" height="35" rx="17" fill="#facc15"/>
  <text x="400" y="498" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0f172a" text-anchor="middle">MULTI-FUNCTIONAL PATHWAY</text>
</svg>
