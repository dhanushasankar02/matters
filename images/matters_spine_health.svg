<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="spineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#spineBg)"/>
  
  <text x="400" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">7-ZONE SPINAL POSTURE ALIGNMENT</text>
  <text x="400" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">Ergonomic Pressure Relief &amp; Orthopedic Support Mapping</text>

  <!-- Mattress Base Contour -->
  <rect x="80" y="320" width="640" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Spine Line -->
  <path d="M 120 250 Q 250 240, 380 260 T 680 250" fill="none" stroke="url(#goldHighlight)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 7 Zones Indicators -->
  <!-- Z1: Head -->
  <circle cx="150" cy="250" r="14" fill="#38bdf8"/>
  <text x="150" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">1</text>
  <text x="150" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">Head / Neck</text>

  <!-- Z2: Shoulders -->
  <circle cx="230" cy="245" r="14" fill="#a7f3d0"/>
  <text x="230" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">2</text>
  <text x="230" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#a7f3d0" text-anchor="middle">Shoulders</text>

  <!-- Z3: Lumbar -->
  <circle cx="320" cy="252" r="16" fill="#facc15"/>
  <text x="320" y="257" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">3</text>
  <text x="320" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#facc15" text-anchor="middle">Lumbar Core</text>

  <!-- Z4: Pelvic / Hips -->
  <circle cx="410" cy="260" r="16" fill="#f43f5e"/>
  <text x="410" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">4</text>
  <text x="410" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#f43f5e" text-anchor="middle">Pelvic / Hips</text>

  <!-- Z5: Thighs -->
  <circle cx="500" cy="256" r="14" fill="#a7f3d0"/>
  <text x="500" y="261" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">5</text>
  <text x="500" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#a7f3d0" text-anchor="middle">Thighs</text>

  <!-- Z6: Knees -->
  <circle cx="580" cy="252" r="14" fill="#38bdf8"/>
  <text x="580" y="257" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">6</text>
  <text x="580" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">Knees</text>

  <!-- Z7: Ankles -->
  <circle cx="650" cy="250" r="14" fill="#c084fc"/>
  <text x="650" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">7</text>
  <text x="650" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#c084fc" text-anchor="middle">Ankles / Feet</text>

  <rect x="250" y="520" width="300" height="40" rx="20" fill="#facc15"/>
  <text x="400" y="545" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#0f172a" text-anchor="middle">ZERO PRESSURE POINT STRAIN</text>
</svg>
